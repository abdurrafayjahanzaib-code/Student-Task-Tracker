<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Task Tracker</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="app-card shadow-lg p-4 rounded-4">
          <div class="text-center mb-4">
            <h1 class="fw-bold">Student Task Tracker</h1>
            <p class="text-muted mb-0">Practice HTML, CSS, Bootstrap and JavaScript in one real project</p>
          </div>

          <!-- Form Section -->
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <input type="text" id="taskTitle" class="form-control" placeholder="Enter task title">
            </div>

            <div class="col-md-3">
              <input type="text" id="taskSubject" class="form-control" placeholder="Enter subject">
            </div>

            <div class="col-md-2">
              <select id="taskPriority" class="form-select">
                <option value="">Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>

            <div class="col-md-3">
              <input type="date" id="taskDeadline" class="form-control">
            </div>

            <div class="col-12 d-grid">
              <button class="btn btn-primary" id="addTaskBtn">Add Task</button>
            </div>
          </div>

          <!-- Search and Filter -->
          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <input type="text" id="searchInput" class="form-control" placeholder="Search by title or subject">
            </div>

            <div class="col-md-4">
              <select id="filterStatus" class="form-select">
                <option value="All">All Tasks</option>
                <option value="Completed">Completed</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>

          <!-- Summary -->
          <div class="row text-center mb-4">
            <div class="col-md-4 mb-2">
              <div class="summary-box">
                <h5>Total Tasks</h5>
                <p id="totalTasks">0</p>
              </div>
            </div>
            <div class="col-md-4 mb-2">
              <div class="summary-box">
                <h5>Completed</h5>
                <p id="completedTasks">0</p>
              </div>
            </div>
            <div class="col-md-4 mb-2">
              <div class="summary-box">
                <h5>Pending</h5>
                <p id="pendingTasks">0</p>
              </div>
            </div>
          </div>

          <!-- Task List -->
          <div id="taskList" class="row g-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
